<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 668" role="img" aria-label="CloudWatch real-life applications slide">
  <defs>
    <style>
      .title { font: 700 48px Inter, Arial, sans-serif; fill: #0f172a; }
      .desc { font: 400 18px Inter, Arial, sans-serif; fill: #3d4a63; }
      .badge { font: 700 20px Inter, Arial, sans-serif; fill: #fff; }
      .feature { font: 700 20px Inter, Arial, sans-serif; }
      .small { font: 400 16px Inter, Arial, sans-serif; fill: #334155; }
      .callout { font: 600 18px Inter, Arial, sans-serif; fill: #fff; }
      .callout2 { font: 700 17px Inter, Arial, sans-serif; fill: #9ff0ff; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1000" height="668" rx="36" fill="#f7fbff"/>
  <g filter="url(#shadow)">
    <rect x="56" y="44" width="38" height="38" rx="10" fill="#1658a6"/>
    <text x="75" y="70" text-anchor="middle" class="badge">04</text>
  </g>
  <text x="126" y="74" class="title">Real-life Applications &amp; Importance</text>

  <g transform="translate(52 134)">
    <g>
      <circle cx="26" cy="26" r="26" fill="#2f9d58"/>
      <path d="M14 34c6-6 16-4 22-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <path d="M34 16l4 4-4 4" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="18" class="feature" fill="#2f9d58">Proactive Monitoring</text>
      <text x="60" y="42" class="desc">Detect issues before users face them.</text>
      <text x="60" y="64" class="desc">Example: Trigger an alert if CPU usage</text>
      <text x="60" y="86" class="desc">is too high.</text>
    </g>

    <g transform="translate(0 92)">
      <circle cx="26" cy="26" r="26" fill="#6a4fb7"/>
      <path d="M26 12c-6 0-10 4-10 9 0 3 2 6 6 8l4 2c4 2 6 5 6 8 0 5-4 9-10 9" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <path d="M26 8v6M26 38v6" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <text x="60" y="18" class="feature" fill="#6a4fb7">Cost Optimization</text>
      <text x="60" y="42" class="desc">Monitor unused resources and set alarms</text>
      <text x="60" y="64" class="desc">to stop idle instances.</text>
    </g>

    <g transform="translate(0 184)">
      <circle cx="26" cy="26" r="26" fill="#e03d62"/>
      <path d="M26 10l14 6v10c0 10-6 18-14 24-8-6-14-14-14-24V16z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
      <path d="M18 27l6 6 10-12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="18" class="feature" fill="#e03d62">Security &amp; Compliance</text>
      <text x="60" y="42" class="desc">Monitor API calls, login attempts, and</text>
      <text x="60" y="64" class="desc">set alerts for suspicious activities.</text>
    </g>

    <g transform="translate(0 276)">
      <circle cx="26" cy="26" r="26" fill="#ff7a1a"/>
      <path d="M17 35l15-15 7 1 1 7-15 15-8 1z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="31" cy="20" r="3" fill="#fff"/>
      <text x="60" y="18" class="feature" fill="#ff7a1a">Operational Excellence</text>
      <text x="60" y="42" class="desc">Get insights into performance and</text>
      <text x="60" y="64" class="desc">availability to improve your systems.</text>
    </g>
  </g>

  <g transform="translate(528 118)">
    <rect x="0" y="0" width="424" height="384" rx="24" fill="#eaf4ff"/>
    <text x="212" y="52" text-anchor="middle" class="feature" fill="#1658a6">Example Use Case</text>
    <text x="212" y="88" text-anchor="middle" class="desc">An e-commerce application uses CloudWatch</text>
    <text x="212" y="112" text-anchor="middle" class="desc">to monitor EC2 CPU usage. If CPU exceeds</text>
    <text x="212" y="136" text-anchor="middle" class="desc">80% for 5 minutes, CloudWatch triggers an</text>
    <text x="212" y="160" text-anchor="middle" class="desc">alarm, sends an SNS notification, and</text>
    <text x="212" y="184" text-anchor="middle" class="desc">auto-scales the instance group.</text>

    <g transform="translate(44 236)" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="16" width="58" height="58" rx="10"/>
      <path d="M58 46h34"/>
      <path d="M84 34l10 12-10 12"/>
      <path d="M102 10h42"/>
      <path d="M134 10v42"/>
      <path d="M134 10l-12 12"/>
      <path d="M134 10l12 12"/>
      <path d="M196 52h50"/>
      <path d="M218 22v30"/>
      <path d="M218 22l-12 12"/>
      <path d="M218 22l12 12"/>
      <path d="M242 40l16-16 12 12"/>
      <path d="M258 24v28"/>
      <circle cx="20" cy="34" r="4" fill="#0f172a" stroke="none"/>
      <text x="28" y="94" text-anchor="middle" class="small">High CPU</text>
      <text x="126" y="94" text-anchor="middle" class="small">CloudWatch</text>
      <text x="126" y="118" text-anchor="middle" class="small">Alarm</text>
      <text x="232" y="94" text-anchor="middle" class="small">Auto Scaling</text>
      <text x="232" y="118" text-anchor="middle" class="small">Triggers</text>
    </g>
  </g>

  <g transform="translate(22 542)">
    <rect width="956" height="86" rx="18" fill="#0e1e41"/>
    <circle cx="46" cy="43" r="19" fill="none" stroke="#ff5f98" stroke-width="4"/>
    <path d="M46 24v38M27 43h38" stroke="#ff5f98" stroke-width="4" stroke-linecap="round"/>
    <text x="86" y="33" class="callout">CloudWatch turns data into insights and insights into actions.</text>
    <text x="86" y="58" class="callout2">It's not just monitoring, it's smart monitoring!</text>
  </g>
</svg>