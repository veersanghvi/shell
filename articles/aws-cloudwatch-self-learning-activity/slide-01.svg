<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 668" role="img" aria-label="Amazon CloudWatch overview slide">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#06162f"/>
      <stop offset="100%" stop-color="#0c234a"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ff6ea8"/>
      <stop offset="100%" stop-color="#b02f6d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <style>
      .title { font: 700 52px Inter, Arial, sans-serif; fill: #ffffff; }
      .subtitle { font: 700 35px Inter, Arial, sans-serif; fill: #ff5f98; }
      .body { font: 400 20px Inter, Arial, sans-serif; fill: #e4ebff; }
      .small { font: 600 18px Inter, Arial, sans-serif; fill: #d7def5; }
      .label { font: 600 16px Inter, Arial, sans-serif; fill: #c6d2ef; }
    </style>
  </defs>
  <rect width="1000" height="668" rx="36" fill="url(#bg)"/>
  <g opacity="0.18" fill="#8ab4ff">
    <circle cx="740" cy="110" r="24"/>
    <circle cx="790" cy="150" r="10"/>
    <circle cx="860" cy="120" r="12"/>
    <circle cx="890" cy="190" r="16"/>
    <circle cx="82" cy="106" r="14"/>
    <circle cx="130" cy="148" r="8"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="56" y="58" width="42" height="42" rx="10" fill="#d13078"/>
    <text x="77" y="87" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">01</text>
  </g>
  <text x="56" y="188" class="title">Amazon CloudWatch</text>
  <text x="56" y="245" class="subtitle">The Eyes and Ears of Your</text>
  <text x="56" y="289" class="subtitle">AWS Cloud Infrastructure</text>
  <line x1="56" y1="323" x2="112" y2="323" stroke="#ff5f98" stroke-width="4" stroke-linecap="round"/>
  <text x="56" y="366" class="body">
    <tspan x="56" dy="0">Amazon CloudWatch is a monitoring and observability</tspan>
    <tspan x="56" dy="32">service for AWS. It helps you collect, monitor, and</tspan>
    <tspan x="56" dy="32">analyze metrics, logs, and events from your AWS</tspan>
    <tspan x="56" dy="32">resources and applications in real time.</tspan>
    <tspan x="56" dy="40">It provides the visibility you need to keep your</tspan>
    <tspan x="56" dy="32">applications running smoothly, optimize performance,</tspan>
    <tspan x="56" dy="32">and respond quickly to issues.</tspan>
  </text>

  <g transform="translate(646 78)">
    <g filter="url(#shadow)">
      <path d="M120 42c0-39-32-71-71-71-33 0-61 22-69 53C32 29 12 51 12 78c0 31 25 56 56 56h136c28 0 50-22 50-50 0-27-21-49-47-49-5-19-22-33-43-33-22 0-40 14-44 32z" fill="#ff3d85" opacity="0.92"/>
      <path d="M120 54c0-31-26-57-57-57-27 0-50 18-57 43C27 42 11 59 11 81c0 24 19 43 43 43h138c22 0 40-18 40-40 0-21-16-38-37-40-5-15-19-26-36-26-18 0-33 11-39 26z" fill="url(#cloud)"/>
      <circle cx="102" cy="80" r="44" fill="#ff4b98" stroke="#ffd0e1" stroke-width="5"/>
      <circle cx="102" cy="80" r="20" fill="none" stroke="#fff" stroke-width="6"/>
      <line x1="133" y1="111" x2="172" y2="150" stroke="#ff4b98" stroke-width="15" stroke-linecap="round"/>
      <line x1="176" y1="154" x2="202" y2="181" stroke="#ffb2d0" stroke-width="12" stroke-linecap="round"/>
      <path d="M75 93l22-14 16 13 20-25 23 8 18-12" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(34 246)">
      <rect x="0" y="0" width="214" height="32" rx="8" fill="#34405f"/>
      <rect x="0" y="44" width="214" height="32" rx="8" fill="#34405f"/>
      <rect x="0" y="88" width="214" height="32" rx="8" fill="#34405f"/>
      <circle cx="172" cy="16" r="5" fill="#dbe7ff"/>
      <circle cx="188" cy="16" r="5" fill="#dbe7ff"/>
      <circle cx="172" cy="60" r="5" fill="#dbe7ff"/>
      <circle cx="188" cy="60" r="5" fill="#dbe7ff"/>
      <circle cx="172" cy="104" r="5" fill="#dbe7ff"/>
      <circle cx="188" cy="104" r="5" fill="#dbe7ff"/>
      <text x="24" y="23" class="small">Stack</text>
      <text x="24" y="67" class="small">Monitor</text>
      <text x="24" y="111" class="small">Respond</text>
    </g>
  </g>

  <g transform="translate(56 560)">
    <rect width="888" height="72" rx="20" fill="#111c37" opacity="0.92"/>
    <circle cx="54" cy="36" r="18" fill="none" stroke="#ff5f98" stroke-width="4"/>
    <line x1="66" y1="48" x2="81" y2="63" stroke="#ff5f98" stroke-width="5" stroke-linecap="round"/>
    <path d="M46 42l8-14 9 10 10-15 10 7 8-9" fill="none" stroke="#ff5f98" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="110" y="30" class="small">Why it matters:</text>
    <text x="110" y="53" class="label">It gives you visibility into cloud health, performance, and incidents so you can act before users are affected.</text>
  </g>
</svg>