<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 668" role="img" aria-label="CloudWatch key features slide">
  <defs>
    <style>
      .title { font: 700 48px Inter, Arial, sans-serif; fill: #0f172a; }
      .desc { font: 400 20px Inter, Arial, sans-serif; fill: #3d4a63; }
      .label { font: 700 23px Inter, Arial, sans-serif; }
      .body { font: 400 17px Inter, Arial, sans-serif; fill: #334155; }
      .badge { font: 700 20px Inter, Arial, sans-serif; fill: #fff; }
      .note { font: 600 18px Inter, Arial, sans-serif; fill: #4c3d97; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1000" height="668" rx="36" fill="#ffffff"/>
  <g filter="url(#shadow)">
    <rect x="56" y="44" width="38" height="38" rx="10" fill="#5b3bb8"/>
    <text x="75" y="70" text-anchor="middle" class="badge">02</text>
  </g>
  <text x="126" y="74" class="title">Key Features</text>
  <text x="126" y="118" class="desc">CloudWatch provides a set of powerful features to monitor, analyze, and act on your AWS resources and applications.</text>

  <g transform="translate(42 178)">
    <line x1="215" y1="0" x2="215" y2="330" stroke="#d5def0" stroke-dasharray="5 7" stroke-width="2"/>
    <line x1="430" y1="0" x2="430" y2="330" stroke="#d5def0" stroke-dasharray="5 7" stroke-width="2"/>
    <line x1="645" y1="0" x2="645" y2="330" stroke="#d5def0" stroke-dasharray="5 7" stroke-width="2"/>

    <g transform="translate(22 18)">
      <circle cx="86" cy="66" r="42" fill="#2f9d58"/>
      <path d="M60 86h18V56h10v30h18V44h10v42h16" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="86" y="152" text-anchor="middle" class="label" fill="#2f9d58">Metrics</text>
      <text x="86" y="188" text-anchor="middle" class="body">Collects and tracks</text>
      <text x="86" y="212" text-anchor="middle" class="body">metrics in real time</text>
      <text x="86" y="236" text-anchor="middle" class="body">(CPU, memory,</text>
      <text x="86" y="260" text-anchor="middle" class="body">network, disk, etc.)</text>
      <text x="86" y="284" text-anchor="middle" class="body">for AWS resources</text>
      <text x="86" y="308" text-anchor="middle" class="body">and custom apps.</text>
    </g>

    <g transform="translate(240 18)">
      <circle cx="86" cy="66" r="42" fill="#5b3bb8"/>
      <rect x="60" y="42" width="32" height="42" rx="4" fill="none" stroke="#fff" stroke-width="4"/>
      <path d="M96 48h14v10" fill="none" stroke="#fff" stroke-width="4"/>
      <path d="M102 44l16 16" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <text x="86" y="152" text-anchor="middle" class="label" fill="#5b3bb8">Logs</text>
      <text x="86" y="188" text-anchor="middle" class="body">Centralizes log data</text>
      <text x="86" y="212" text-anchor="middle" class="body">from AWS services,</text>
      <text x="86" y="236" text-anchor="middle" class="body">applications, and</text>
      <text x="86" y="260" text-anchor="middle" class="body">custom sources so</text>
      <text x="86" y="284" text-anchor="middle" class="body">you can store, search,</text>
      <text x="86" y="308" text-anchor="middle" class="body">and analyze them.</text>
    </g>

    <g transform="translate(455 18)">
      <circle cx="86" cy="66" r="42" fill="#e03d62"/>
      <path d="M86 36c-15 0-27 12-27 27 0 18 27 46 27 46s27-28 27-46c0-15-12-27-27-27z" fill="none" stroke="#fff" stroke-width="4"/>
      <circle cx="86" cy="64" r="10" fill="none" stroke="#fff" stroke-width="4"/>
      <text x="86" y="152" text-anchor="middle" class="label" fill="#e03d62">Alarms</text>
      <text x="86" y="188" text-anchor="middle" class="body">Sends alerts when</text>
      <text x="86" y="212" text-anchor="middle" class="body">metrics or logs cross</text>
      <text x="86" y="236" text-anchor="middle" class="body">defined thresholds so</text>
      <text x="86" y="260" text-anchor="middle" class="body">you can take action</text>
      <text x="86" y="284" text-anchor="middle" class="body">quickly.</text>
    </g>

    <g transform="translate(670 18)">
      <circle cx="86" cy="66" r="42" fill="#ff7a1a"/>
      <rect x="58" y="40" width="56" height="56" rx="6" fill="none" stroke="#fff" stroke-width="4"/>
      <line x1="86" y1="40" x2="86" y2="96" stroke="#fff" stroke-width="4"/>
      <line x1="58" y1="68" x2="114" y2="68" stroke="#fff" stroke-width="4"/>
      <text x="86" y="152" text-anchor="middle" class="label" fill="#ff7a1a">Dashboards</text>
      <text x="86" y="188" text-anchor="middle" class="body">Visualize metrics</text>
      <text x="86" y="212" text-anchor="middle" class="body">and logs in custom</text>
      <text x="86" y="236" text-anchor="middle" class="body">dashboards for better</text>
      <text x="86" y="260" text-anchor="middle" class="body">insights and faster</text>
      <text x="86" y="284" text-anchor="middle" class="body">decision making.</text>
    </g>
  </g>

  <g transform="translate(32 560)">
    <rect width="936" height="66" rx="18" fill="#f1effd"/>
    <path d="M40 33l9-18 8 18 20 4-15 12 4 20-16-10-16 10 4-20-15-12z" fill="#5b3bb8"/>
    <text x="86" y="39" class="note">CloudWatch gives you a unified view of your AWS resources and applications.</text>
  </g>
</svg>